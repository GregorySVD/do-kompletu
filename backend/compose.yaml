services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: do_kompletu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - do_kompletu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d do_kompletu"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./docker/minio
    image: do-kompletu-minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-do-kompletu-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-do-kompletu-local-only-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - do_kompletu_minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  do_kompletu_postgres_data:
  do_kompletu_minio_data:
