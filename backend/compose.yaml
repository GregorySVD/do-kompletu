services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: do_kompletu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - do_kompletu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d do_kompletu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  do_kompletu_postgres_data:
